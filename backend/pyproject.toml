[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ticket-triage-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.8.2",
  "pydantic-settings==2.2.1",
  "sqlmodel==0.0.21",
  "psycopg[binary]==3.2.10",
  "python-dotenv==1.0.1",
  "transformers==4.44.2",
  "torch==2.6.0",
  "sentence-transformers==3.0.1",
  "numpy>=1.26",
  "websockets==12.0",
  "redis==5.0.1",
  "hiredis==2.3.2",
  "pgvector==0.2.4",
  "python-multipart==0.0.6",
  "pandas==2.2.0",
  "httpx==0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E","F","I"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
markers = ["asyncio"]
